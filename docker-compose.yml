services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    environment:
      - DATABASE_URL=sqlite:////data/murphy.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
